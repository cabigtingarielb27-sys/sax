<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0ea5ff" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>PadalaPay</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f8fc; }
      .pp-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, system-ui, sans-serif; color: #0A1F44;
      }
      .pp-boot img { width: 88px; height: 88px; border-radius: 20px; }
    </style>
  </head>
  <body>
    <div id="root" class="pp-boot">
      <img src="icon.png" alt="PadalaPay" />
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {})
        );
      }
    </script>
    <!-- Capacitor loads the web bundle from the local www/ build, or you can point the
         WebView at the live app. The service worker caches it so it opens offline. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
